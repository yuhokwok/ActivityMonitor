name: ActivityMonitor
options:
  bundleIdPrefix: com.invivo.ios
  deploymentTarget:
    iOS: '17.0'
  knownRegions: [en, zh-Hant, zh-Hans, ja]
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  MonitorKit:
    path: Packages/MonitorKit
targets:
  ActivityMonitor:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Sources/UI
      - path: Sources/Services
      - path: Sources/Resources/Localization
        type: group
      - path: Sources/Resources/Assets.xcassets
      - path: Sources/Resources/BatterySequences
        type: folder
      - path: Config/PrivacyInfo.xcprivacy
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: Activity Monitor
        CFBundleURLTypes:
          - CFBundleURLSchemes: [activitymonitor]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIUserInterfaceStyle: Dark
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.invivo.ios.Activity-Monitor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: MonitorKit
        product: MonitorDomain
      - package: MonitorKit
        product: MonitorTelemetry
      - package: MonitorKit
        product: MonitorActivity
      - target: ActivityMonitorLiveActivity
  ActivityMonitorLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Config/Widget/PrivacyInfo.xcprivacy
    info:
      path: Config/Widget-Info.plist
      properties:
        CFBundleDisplayName: Activity Monitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.invivo.ios.Activity-Monitor.LiveActivity
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: MonitorKit
        product: MonitorDomain
      - package: MonitorKit
        product: MonitorTelemetry
      - package: MonitorKit
        product: MonitorActivity
  ActivityMonitorTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - package: MonitorKit
        product: MonitorDomain
      - package: MonitorKit
        product: MonitorTelemetry
      - package: MonitorKit
        product: MonitorActivity
      - target: ActivityMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.invivo.ios.Activity-Monitor.Tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ActivityMonitor:
    build:
      targets:
        ActivityMonitor: all
    run:
      config: Debug
    test:
      targets: [ActivityMonitorTests]
